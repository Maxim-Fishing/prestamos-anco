<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Préstamos ANCO</title>
<style>
:root{
  --bg:#eaf0ed; --surface:#ffffff; --surface-2:#f4f7f5; --inset:#eef2f0;
  --ink:#15211c; --muted:#5d6c64; --faint:#8a988f; --line:#dde4e0;
  --brand:#0e7a5f; --brand-ink:#0a5a46; --brand-soft:#dff0ea;
  --accent:#b8891f; --good:#15885a; --good-soft:#dcefe4;
  --warn:#c07a16; --warn-soft:#f7ebd4; --bad:#bb3b2c; --bad-soft:#f6e0dc;
  --on-brand:#ffffff; --shadow:0 1px 2px rgba(20,40,32,.05),0 8px 24px rgba(20,40,32,.06);
  --r:16px; --r-sm:11px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Sora","Plus Jakarta Sans",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1511; --surface:#16211c; --surface-2:#1c2822; --inset:#121b16;
  --ink:#e9efeb; --muted:#9dada4; --faint:#73827a; --line:#273530;
  --brand:#2bb78c; --brand-ink:#53d6ab; --brand-soft:#123a30;
  --accent:#e0bc5e; --good:#2bb78c; --good-soft:#123a30;
  --warn:#e0a94a; --warn-soft:#38301b; --bad:#e2695a; --bad-soft:#3a211d;
  --on-brand:#06110d; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:600;letter-spacing:-.01em}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  background:var(--bg);position:relative;overflow:hidden}

.appbar{background:var(--brand);color:var(--on-brand);padding:14px 18px 16px}
.appbar .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.appbar .brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:16px}
.appbar .brand .dot{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:15px}
.ghost{background:rgba(255,255,255,.14);color:var(--on-brand);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ghost:active{background:rgba(255,255,255,.26)}
.basecard{margin-top:14px}
.basecard .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.82;font-weight:600}
.basecard .amt{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;margin-top:2px}
.basecard .sub{font-size:12.5px;opacity:.85;margin-top:3px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px 96px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 10px;box-shadow:var(--shadow)}
.chip .n{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.15}
.chip .t{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.chip.mora .n{color:var(--bad)}
.chip.cobrar .n{color:var(--accent)}
.seg{display:flex;background:var(--inset);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.sectitle{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin:4px 2px 10px}
.list{display:flex;flex-direction:column;gap:9px}
.row{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.row:active{transform:scale(.995)}
.av{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;flex:none}
.row .val{font-family:var(--display);font-weight:700;font-size:15px}
.row .val.in{color:var(--good)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.b-activo{background:var(--brand-soft);color:var(--brand-ink)}
.b-mora{background:var(--bad-soft);color:var(--bad)}
.b-pagado{background:var(--good-soft);color:var(--good)}
.b-cap{background:var(--inset);color:var(--muted)}
.b-int{background:var(--warn-soft);color:var(--warn)}
.b-cuota{background:var(--brand-soft);color:var(--brand-ink)}
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:8px}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:280px;margin:0 auto}
.fab{position:fixed;right:max(18px,calc(50% - 280px + 18px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--brand);color:var(--on-brand);border-radius:16px;padding:14px 18px;font-family:var(--display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(14,122,95,.42)}
.fab:active{transform:translateY(1px)}
.fab .plus{font-size:19px;line-height:1}
.dethead{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--inset);display:grid;place-items:center;font-size:18px;flex:none}
.dethead .t{font-family:var(--display);font-weight:700;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.saldo-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.saldo-amt{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.08;margin:3px 0 2px}
.saldo-sub{font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--inset);overflow:hidden;margin-top:12px}
.prog>span{display:block;height:100%;background:var(--brand);border-radius:999px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv .k{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kv .v{font-weight:600;font-size:14.5px;margin-top:1px}
.kv .full{grid-column:1 / -1}
.evid{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:block;width:100%}
.evid img{display:block;width:100%;max-height:240px;object-fit:cover}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand);color:var(--on-brand);border-radius:13px;padding:14px;font-weight:700;font-family:var(--display);font-size:15px;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btnrow{display:flex;gap:10px;margin-bottom:14px}
.btnrow .btn{flex:1}
.formwrap{flex:1;overflow-y:auto;padding:18px 16px 28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field label .req{color:var(--bad)}
.input,.select,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15.5px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder{color:var(--faint)}
textarea.input{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;font-size:14px;color:var(--muted)}
.toggle button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.photo{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:var(--surface-2);display:block}
.photo.has{padding:0;border-style:solid;overflow:hidden}
.photo img{display:block;width:100%;max-height:220px;object-fit:cover}
.photo .ic{font-size:26px}
.photo .t{font-weight:600;color:var(--ink);margin-top:6px;font-size:14px}
.photo .s{font-size:12px;margin-top:2px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.center{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:26px 20px}
.logo{width:62px;height:62px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;margin:0 auto 14px;box-shadow:0 10px 26px rgba(14,122,95,.4)}
.center h1{text-align:center;font-size:24px}
.center .tag{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 24px}
.splash{flex:1;display:grid;place-items:center;color:var(--muted);gap:14px;text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.62);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:14px;display:block}
.confirm{background:var(--surface);border-radius:18px;padding:22px;max-width:320px;width:100%;box-shadow:var(--shadow)}
.confirm h3{font-size:18px;margin-bottom:8px}
.confirm p{color:var(--muted);font-size:14px;margin:0 0 18px}
.confirm .btnrow{margin:0}
.saving{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.5);display:grid;place-items:center}
.saving .box{background:var(--surface);border-radius:16px;padding:22px 30px;text-align:center;box-shadow:var(--shadow)}
.codebox{background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:var(--ink);text-align:left;margin:10px 0}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.row:active,.btn:active,.fab:active{transform:none}}
</style>

<body>
<div id="app">
  <div class="splash"><div><div class="spin"></div><div style="margin-top:12px">Cargando Préstamos ANCO…</div></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   PASO ÚNICO DE CONFIGURACIÓN:
   Reemplaza los valores de abajo por los de TU proyecto Firebase.
   (Firebase Console > Configuración del proyecto > Tus apps > Web)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDX29a1ULWQQZY6KRDX6W9PAOhwzdOXIXQ",
  authDomain: "prestamos-anco-72ff1.firebaseapp.com",
  projectId: "prestamos-anco-72ff1",
  storageBucket: "prestamos-anco-72ff1.firebasestorage.app",
  messagingSenderId: "348314418576",
  appId: "1:348314418576:web:023c91de237834b1cac715"
};
/* ============================================================ */

let auth, db, me=null, meNombre='';
let unsubLoans=null, unsubPays=null;
const app=document.getElementById('app');
const S={ screen:'loading', config:null, loans:[], payments:[], selId:null, tab:'pagos',
  loanType:'unico', periodic:'mensual', payType:'cuota',
  draftFile:null, draftURL:null, error:'', loanDraft:{} };

/* ---------- utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>(S.config&&S.config.moneda)||'COP';
function money(n){try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:cur(),maximumFractionDigits:0}).format(Math.round(+n||0));}catch(e){return '$'+Math.round(+n||0).toLocaleString('es-CO');}}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?0:n;};
function initials(name){const p=String(name||'?').trim().split(/\s+/);return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');if(isNaN(d))return esc(s);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ms){if(!ms)return '';const d=new Date(ms);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
const qs=s=>app.querySelector(s);
const dataScreen=()=>S.screen==='home'||S.screen==='detail';

function calc(loan){
  const pagos=S.payments.filter(p=>p.loanId===loan.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const pagado=pagos.reduce((s,p)=>s+num(p.monto),0);
  let total;
  if(loan.tipo==='cuotas'){ total=num(loan.valorCuota)*num(loan.numCuotas); if(!total) total=num(loan.monto)*(1+num(loan.interesPct)/100); }
  else { total=num(loan.monto)*(1+num(loan.interesPct)/100); }
  const saldo=Math.max(0,total-pagado);
  const estado = saldo<=0?'pagado':(loan.fechaVencimiento && new Date(loan.fechaVencimiento+'T00:00:00')<today0()?'mora':'activo');
  const cuotasPag=(loan.tipo==='cuotas'&&num(loan.valorCuota))?Math.min(num(loan.numCuotas),Math.floor(pagado/num(loan.valorCuota))):null;
  return {pagos,pagado,total,saldo,estado,cuotasPag};
}
function totals(){
  const prestado=S.loans.reduce((s,l)=>s+num(l.monto),0);
  const recuperado=S.payments.reduce((s,p)=>s+num(p.monto),0);
  let porCobrar=0,enMora=0,activos=0;
  S.loans.forEach(l=>{const c=calc(l);porCobrar+=c.saldo;if(c.estado==='mora')enMora+=c.saldo;if(c.estado!=='pagado')activos++;});
  const base=num(S.config&&S.config.baseInicial);
  return {prestado,recuperado,porCobrar,enMora,base,saldoBase:base-prestado+recuperado,activos};
}
const loanById=id=>S.loans.find(l=>l.id===id)||null;

/* ---------- boot / auth ---------- */
function boot(){
  if(String(firebaseConfig.apiKey).indexOf('PEGA')===0){ S.screen='noconfig'; return render(); }
  try{ const fapp=initializeApp(firebaseConfig); auth=getAuth(fapp); db=getFirestore(fapp); }
  catch(e){ S.screen='noconfig'; return render(); }
  onAuthStateChanged(auth, async (user)=>{
    if(user){ me=user; await afterLogin(); }
    else { me=null; teardown(); S.screen='login'; S.error=''; render(); }
  });
}
function teardown(){ if(unsubLoans){unsubLoans();unsubLoans=null;} if(unsubPays){unsubPays();unsubPays=null;} S.loans=[];S.payments=[]; }
async function afterLogin(){
  try{
    const uSnap=await getDoc(doc(db,'usuarios',me.uid));
    meNombre=uSnap.exists()?(uSnap.data().nombre||''):'';
    const cSnap=await getDoc(doc(db,'config','app'));
    S.config=cSnap.exists()?cSnap.data():null;
    subscribe();
    S.screen = !meNombre ? 'profile' : (!S.config ? 'setup' : 'home');
  }catch(e){ S.error='No se pudo cargar: '+(e&&e.message||e); S.screen='login'; }
  render();
}
function subscribe(){
  if(unsubLoans||!db)return;
  unsubLoans=onSnapshot(collection(db,'loans'),s=>{S.loans=s.docs.map(d=>({id:d.id,...d.data()}));if(dataScreen())render();},()=>{});
  unsubPays=onSnapshot(collection(db,'payments'),s=>{S.payments=s.docs.map(d=>({id:d.id,...d.data()}));if(dataScreen())render();},()=>{});
}

/* ---------- render ---------- */
function render(){
  let h;
  switch(S.screen){
    case 'noconfig': h=viewNoConfig(); break;
    case 'login': h=viewLogin(); break;
    case 'profile': h=viewProfile(); break;
    case 'setup': h=viewSetup(); break;
    case 'home': h=viewHome(); break;
    case 'detail': h=viewDetail(); break;
    case 'newLoan': h=viewLoanForm(); break;
    case 'newPayment': h=viewPayForm(); break;
    default: h='<div class="splash"><div><div class="spin"></div><div style="margin-top:12px">Cargando…</div></div></div>';
  }
  app.innerHTML=h; bind();
}

function viewNoConfig(){
  return '<div class="formwrap"><div style="text-align:center"><div class="logo">A</div><h1>Falta configurar Firebase</h1></div>'+
    '<p class="tag" style="text-align:center">Esta app necesita tu proyecto Firebase para funcionar. Edita <b>index.html</b> y pega tu configuración en el bloque <b>firebaseConfig</b>.</p>'+
    '<div class="codebox">const firebaseConfig = {\n  apiKey: "...",\n  authDomain: "...",\n  projectId: "...",\n  storageBucket: "...",\n  messagingSenderId: "...",\n  appId: "..."\n};</div>'+
    '<p class="hint" style="text-align:center">Lo encuentras en Firebase Console → Configuración del proyecto → Tus apps → Web.</p></div>';
}

function viewLogin(){
  return '<div class="center"><div class="logo">A</div><h1>Préstamos ANCO</h1><div class="tag">Ingresa con tu correo y contraseña</div>'+
    (S.error?'<div class="err">'+esc(S.error)+'</div>':'')+
    '<form id="loginForm">'+
      '<div class="field"><label>Correo</label><input class="input" id="l_email" type="email" inputmode="email" autocomplete="username" placeholder="correo@ejemplo.com"></div>'+
      '<div class="field"><label>Contraseña</label><input class="input" id="l_pw" type="password" autocomplete="current-password" placeholder="••••••"></div>'+
      '<button class="btn" type="submit">Ingresar</button>'+
    '</form></div>';
}
async function doLogin(){
  S.error='';
  const email=(qs('#l_email').value||'').trim(), pw=qs('#l_pw').value;
  if(!email||!pw){S.error='Escribe tu correo y contraseña.';return render();}
  savingOn('Ingresando…');
  try{ await signInWithEmailAndPassword(auth,email,pw); }
  catch(e){ S.error=authMsg(e); savingOff(); return render(); }
  savingOff();
}
function authMsg(e){
  const c=(e&&e.code)||'';
  if(c.indexOf('invalid-credential')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0) return 'Correo o contraseña incorrectos.';
  if(c.indexOf('invalid-email')>=0) return 'El correo no es válido.';
  if(c.indexOf('too-many-requests')>=0) return 'Demasiados intentos. Espera un momento.';
  if(c.indexOf('network')>=0) return 'Sin conexión. Revisa tu internet.';
  return 'No se pudo ingresar: '+(e&&e.message||c);
}

function viewProfile(){
  return '<div class="center"><div class="logo">A</div><h1>¿Cómo te llamas?</h1><div class="tag">Así se registrará quién hace cada movimiento.</div>'+
    (S.error?'<div class="err">'+esc(S.error)+'</div>':'')+
    '<form id="profileForm"><div class="field"><label>Tu nombre</label><input class="input" id="pf_nombre" placeholder="Ej: Andrés" autocomplete="off"></div>'+
    '<button class="btn" type="submit">Continuar</button></form></div>';
}
async function doProfile(){
  S.error='';
  const n=(qs('#pf_nombre').value||'').trim();

// Sin Firebase Storage (plan gratis): la foto se comprime en el navegador
// y se guarda como data URL dentro del documento de Firestore.
function uploadPhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(u);
      const max=1200; let w=img.width,h=img.height;
      if(w>max||h>max){ if(w>=h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.72, data=c.toDataURL('image/jpeg',q);
      while(data.length>900000 && q>0.35){ q-=0.1; data=c.toDataURL('image/jpeg',q); }
      resolve(data);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('No se pudo leer la imagen'));};
    img.src=u;
  });
}

      monto,interesPct:intr,periodicidad:qs('#f_per').value,tipo:S.loanType,

      evidenciaUrl:url,notas:qs('#f_notas').value.trim(),registradoPor:meNombre,createdAt:Date.now()};

    clearDraft(); S.loanDraft={}; S.selId=ref.id; S.screen='detail';

}

  if(el=e.target.closest('[data-ptype]')){S.payType=el.getAttribute('data-ptype');el.parentNode.querySelectorAll('[data-ptype]').forEach(b=>b.setAttribute('aria-pressed',b===el));return;}
  if(el=e.target.closest('[data-open]')){S.selId=el.getAttribute('data-open');S.screen='detail';render();return;}
  if(el=e.target.closest('[data-viewimg]')){lightbox(el.getAttribute('data-viewimg'));return;}
  const act=e.target.closest('[data-act]'); if(!act)return;
  switch(act.getAttribute('data-act')){
    case 'logout': signOut(auth); break;
    case 'newLoan': clearDraft();S.loanDraft={};S.loanType='unico';S.periodic='mensual';S.error='';S.screen='newLoan';render();break;
    case 'newPayment': clearDraft();S.payType='cuota';S.error='';S.screen='newPayment';render();break;
    case 'back': clearDraft();S.error='';S.screen='home';render();break;
    case 'backDetail': clearDraft();S.error='';S.screen='detail';render();break;
    case 'delLoan': delLoan(); break;
  }
});

boot();
</script>
</body>
</html>

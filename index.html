<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANCO Préstamos</title>
<style>
:root{
  --bg:#f5f5ef; --surface:#ffffff; --surface-2:#faf9f3; --inset:#efeee6;
  --ink:#333333; --muted:#6b6f6a; --faint:#9a9d96; --line:#e5e3d9;
  --brand:#0b5d4b; --brand-ink:#094a3c; --brand-soft:#dbeae4;
  --accent:#d4af37; --accent-ink:#8f7415; --accent-soft:#f6eccf;
  --good:#15885a; --good-soft:#dcefe4;
  --warn:#b8862a; --warn-soft:#f6ecd2; --bad:#b23b2c; --bad-soft:#f5ddd6;
  --header:#0b5d4b; --on-brand:#ffffff;
  --shadow:0 1px 2px rgba(20,40,32,.05),0 8px 24px rgba(20,40,32,.07);
  --c-disp:#2f6fb0; --c-aldia:#0e9f6e; --c-mora:#e02424;
  --r:16px; --r-sm:11px;
  --font:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Montserrat",sans-serif; --script:"Allura",cursive;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171a18; --surface:#20241f; --surface-2:#262b24; --inset:#1c201b;
  --ink:#edefe9; --muted:#a6aca3; --faint:#787d75; --line:#333a33;
  --brand:#1aa07a; --brand-ink:#49d6ad; --brand-soft:#123a30;
  --accent:#e0bc5e; --accent-ink:#e0bc5e; --accent-soft:#39321d;
  --good:#2bb78c; --good-soft:#123a30;
  --warn:#e0b24a; --warn-soft:#38301b; --bad:#e2695a; --bad-soft:#3a211d;
  --header:#0b5d4b; --on-brand:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  --c-disp:#4f97d6; --c-aldia:#1aa877; --c-mora:#ef5b4b;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:-.01em}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

/* ---- header ---- */
.appbar{background:var(--header);color:var(--on-brand);padding:12px 16px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.01em}
.iso{width:30px;height:30px;border-radius:9px;background:#f5f5ef;display:grid;place-items:center;padding:3px;flex:none}
.iso svg{display:block;width:100%;height:100%}
.ghost{background:rgba(255,255,255,.16);color:var(--on-brand);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ghost:active{background:rgba(255,255,255,.28)}

/* ---- panels / scroll ---- */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.sectitle{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700;margin:4px 2px 10px}
.panel-h{font-family:var(--display);font-weight:700;font-size:20px;margin:2px 2px 14px}

/* base card */
.basecard{background:var(--brand);color:var(--on-brand);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.basecard .brow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.basecard .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.85;font-weight:600}
.basecard .amt{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin-top:2px}
.basecard .sub{font-size:12.5px;opacity:.9;margin-top:3px}

.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 10px;box-shadow:var(--shadow)}
.chip .n{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15}
.chip .t{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}
.chip.mora .n{color:var(--bad)}
.chip.cobrar .n{color:var(--accent-ink)}

/* dashboard donut */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.dash-body{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{flex:0 0 auto;margin:0 auto}
.dn-amt{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:20px}
.dn-lbl{fill:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px}
.lg-row{display:grid;grid-template-columns:13px 1fr auto auto;align-items:center;gap:9px;font-size:13px}
.lg-dot{width:12px;height:12px;border-radius:3px}
.lg-k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-v{font-weight:600}
.lg-p{color:var(--faint);min-width:40px;text-align:right}
.saldo-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}

/* alerts */
.odbanner{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.od-h{color:var(--bad);font-weight:700;font-size:13.5px;margin-bottom:8px}
.upbanner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.up-h{color:var(--accent-ink);font-weight:700;font-size:13.5px;margin-bottom:8px}
.od-row{display:flex;align-items:stretch;gap:8px;margin-top:6px}
.od-main{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left}
.od-wa{flex:0 0 auto;background:#25d366;color:#06210f;font-weight:700;font-size:12px;border-radius:10px;padding:0 12px}
.od-nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-det{font-weight:700;font-size:12.5px;flex:none;white-space:nowrap}
.odbanner .od-det{color:var(--bad)}
.upbanner .od-det{color:var(--accent-ink)}

/* lists */
.list{display:flex;flex-direction:column;gap:9px}
.row{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.row:active{transform:scale(.995)}
.av{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .right{text-align:right;flex:none}
.row .val{font-family:var(--display);font-weight:700;font-size:15px}
.row .val.in{color:var(--good)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;text-transform:uppercase}
.b-activo{background:var(--brand-soft);color:var(--brand-ink)}
.b-mora{background:var(--bad-soft);color:var(--bad)}
.b-pagado{background:var(--good-soft);color:var(--good)}
.b-cap{background:var(--inset);color:var(--muted)}
.b-int{background:var(--warn-soft);color:var(--warn)}
.b-cuota{background:var(--brand-soft);color:var(--brand-ink)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{font-size:34px;margin-bottom:8px}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}
.empty p{font-size:13.5px;max-width:280px;margin:0 auto}

/* calendar agenda */
.cal-day{margin-bottom:16px}
.cal-dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px}
.cal-dt{font-family:var(--display);font-weight:700;font-size:14px;text-transform:capitalize}
.cal-dt.hoy{color:var(--brand)}
.cal-tot{font-size:12.5px;color:var(--muted);font-weight:600}
.cal-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:10px 12px;margin-top:7px;box-shadow:var(--shadow)}
.cal-item.venc{border-left-color:var(--bad)}
.cal-item .ci-mid{flex:1;min-width:0}
.cal-item .ci-nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-item .ci-sub{font-size:12px;color:var(--muted)}
.cal-item .ci-amt{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap}
.ci-acts{display:flex;gap:6px;flex:none}
.ci-wa{background:#25d366;color:#06210f;font-weight:700;font-size:11px;border-radius:8px;padding:6px 9px}
.ci-pay{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:11px;border-radius:8px;padding:6px 9px}

/* detail */
.dethead{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--inset);display:grid;place-items:center;font-size:18px;flex:none}
.dethead .t{font-family:var(--display);font-weight:700;font-size:16px}
.saldo-amt{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.08;margin:3px 0 2px}
.saldo-sub{font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--inset);overflow:hidden;margin-top:12px}
.prog>span{display:block;height:100%;background:var(--brand);border-radius:999px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv .k{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kv .v{font-weight:600;font-size:14.5px;margin-top:1px}
.kv .full{grid-column:1 / -1}
.evid{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);display:block;width:100%}
.evid img{display:block;width:100%;max-height:240px;object-fit:cover}
.plan-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.plan-sum>div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.ps-k{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.ps-v{font-weight:700;font-size:13.5px}
.ps-v.bad{color:var(--bad)}
.plan-tbl{overflow-x:auto}
table.cuotas{width:100%;border-collapse:collapse;font-size:13px}
table.cuotas th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)}
table.cuotas td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.cuotas tr:last-child td{border-bottom:0}
table.cuotas tr.q-venc td{background:var(--bad-soft)}
.qa{text-align:right}
.qpay{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:11.5px;border-radius:8px;padding:5px 10px;white-space:nowrap}
.qok{color:var(--good);font-weight:700}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--brand);color:var(--on-brand);border-radius:13px;padding:14px;font-weight:700;font-family:var(--display);font-size:15px;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.gold{background:var(--accent);color:#3a2f06}
.btn.wa{background:#25d366;color:#06210f}
.btnrow{display:flex;gap:10px;margin-bottom:14px}
.btnrow .btn{flex:1}
.waicon{background:#25d366;color:#06210f;font-weight:700;font-size:11px;border-radius:7px;padding:4px 7px;margin-left:8px;vertical-align:middle}
.wacard{background:var(--brand-soft);border:1px solid var(--brand);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.wacard .wc-h{font-family:var(--display);font-weight:700;font-size:15px}
.wacard .wc-s{font-size:13px;color:var(--muted);margin-top:4px}

/* forms */
.formwrap{flex:1;overflow-y:auto;padding:18px 16px 28px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field label .req{color:var(--bad)}
.input,.select,textarea.input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15.5px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.input::placeholder{color:var(--faint)}
textarea.input{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--faint);margin-top:6px}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;font-size:14px;color:var(--muted)}
.toggle button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.photo{border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);background:var(--surface-2);display:block}
.photo.has{padding:0;border-style:solid;overflow:hidden}
.photo img{display:block;width:100%;max-height:220px;object-fit:cover}
.photo .ic{font-size:26px}
.photo .t{font-weight:600;color:var(--ink);margin-top:6px;font-size:14px}
.photo .s{font-size:12px;margin-top:2px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}
.codebox{background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;color:var(--ink);text-align:left;margin:10px 0}

/* login / centered */
.loginwrap{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;background:#07211a}
.bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bgveil{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,40,30,.42) 0%,rgba(5,28,20,.7) 52%,rgba(3,18,13,.94) 100%)}
.loginover{position:relative;z-index:2;color:#fff}
.loginover h1{color:#fff}
.loginover h1 .g{color:#e9c96b}
.loginover .slogan{color:#e9c96b;font-size:30px}
.loginover .tag{color:rgba(255,255,255,.82)}
.loginover .logo{background:rgba(255,255,255,.96)}
.loginover .field label{color:rgba(255,255,255,.88)}
.loginover .input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.loginover .input::placeholder{color:rgba(255,255,255,.6)}
.loginover .input:focus{border-color:#e9c96b;box-shadow:0 0 0 3px rgba(212,175,55,.28)}
.center{flex:1;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;padding:26px 20px}
.logo{width:88px;height:88px;border-radius:22px;background:#f5f5ef;display:grid;place-items:center;padding:12px;margin:0 auto 14px;box-shadow:var(--shadow)}
.logo svg{width:100%;height:100%}
.center h1{text-align:center;font-size:25px;font-weight:800}
.center h1 .g{color:var(--accent-ink)}
.slogan{text-align:center;font-family:var(--script);color:var(--brand);font-size:26px;line-height:1;margin:2px 0 4px}
.center .tag{text-align:center;color:var(--muted);font-size:14px;margin:8px 0 24px}
.splash{flex:1;display:grid;place-items:center;color:var(--muted);gap:14px;text-align:center;padding:20px}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,20,16,.62);display:grid;place-items:center;padding:20px}
.lightbox img{max-width:100%;max-height:82vh;border-radius:14px;display:block}
.confirm{background:var(--surface);border-radius:18px;padding:22px;max-width:320px;width:100%;box-shadow:var(--shadow)}
.confirm h3{font-size:18px;margin-bottom:8px}
.confirm p{color:var(--muted);font-size:14px;margin:0 0 18px}
.confirm .btnrow{margin:0}
.saving{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.5);display:grid;place-items:center}
.saving .box{background:var(--surface);border-radius:16px;padding:22px 30px;text-align:center;box-shadow:var(--shadow)}

/* bottom nav + fab */
.bnav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--faint);font-size:10.5px;font-weight:600}
.bnav button .bi{font-size:19px;line-height:1}
.bnav button[aria-selected="true"]{color:var(--brand)}
.fab{position:absolute;right:16px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--brand);color:var(--on-brand);border-radius:16px;padding:13px 17px;font-family:var(--display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;box-shadow:0 8px 22px rgba(11,93,75,.42)}
.fab:active{transform:translateY(1px)}
.fab .plus{font-size:18px;line-height:1}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.row:active,.btn:active,.fab:active{transform:none}}
</style>

/* ---------- utils ---------- */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>(S.config&&S.config.moneda)||'COP';
function money(n){try{return new Intl.NumberFormat('es-CO',{style:'currency',currency:cur(),maximumFractionDigits:0}).format(Math.round(+n||0));}catch(e){return '$'+Math.round(+n||0).toLocaleString('es-CO');}}
function moneyShort(n){n=Math.round(+n||0);if(n>=1e6)return '$'+(n/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+'M';if(n>=1e3)return '$'+Math.round(n/1e3)+'k';return '$'+n;}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.-]/g,''));return isNaN(n)?0:n;};
function initials(name){const p=String(name||'?').trim().split(/\s+/);return ((p[0]||'')[0]||'?').toUpperCase()+((p[1]||'')[0]||'').toUpperCase();}
function today0(){const d=new Date();d.setHours(0,0,0,0);return d;}
function fmtDate(s){if(!s)return '—';const d=new Date(s+'T00:00:00');if(isNaN(d))return esc(s);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateTime(ms){if(!ms)return '';const d=new Date(ms);return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}
function fmtD(d){try{return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return '—';}}
function fmtDLong(d){try{return d.toLocaleDateString('es-CO',{weekday:'long',day:'2-digit',month:'long'});}catch(e){return '—';}}
const qs=s=>app.querySelector(s);
const dataScreen=()=>S.screen==='home'||S.screen==='detail';
function addPeriod(d,per,n){const x=new Date(d.getTime());
  if(per==='mensual')x.setMonth(x.getMonth()+n); else if(per==='quincenal')x.setDate(x.getDate()+15*n);
  else if(per==='diario')x.setDate(x.getDate()+1*n); else x.setDate(x.getDate()+7*n); return x;}
function daysUntil(due){const t=today0();const d=new Date(due.getFullYear(),due.getMonth(),due.getDate());return Math.round((d-t)/86400000);}
function cuotaStart(loan){ const per=loan.periodicidad||'semanal';
  if(loan.fechaPrimeraCuota) return new Date(loan.fechaPrimeraCuota+'T00:00:00');
  if(loan.fechaDesembolso) return addPeriod(new Date(loan.fechaDesembolso+'T00:00:00'),per,1);
  return addPeriod(new Date(loan.createdAt||Date.now()),per,1); }

/* ---------- cálculos ---------- */
function calc(loan){
  const pagos=S.payments.filter(p=>p.loanId===loan.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  const pagado=pagos.reduce((s,p)=>s+num(p.monto),0);
  const total=num(loan.monto)*(1+num(loan.interesPct)/100);
  const saldo=Math.max(0,total-pagado);
  const valorCuota=num(loan.valorCuota);
  const esCuotas = loan.tipo==='cuotas' && valorCuota>0 && total>0;
  let cuotas=[], proxima=null, vencidasN=0, vencidasMonto=0, cuotasPag=0, numCuotas=0;
  if(esCuotas){
    numCuotas=Math.max(1,Math.ceil(total/valorCuota));
    const per=loan.periodicidad||'semanal', start=cuotaStart(loan); let rest=pagado;
    for(let i=1;i<=numCuotas;i++){
      const mv = (i===numCuotas) ? Math.max(0,total-valorCuota*(numCuotas-1)) : valorCuota;
      const due=addPeriod(start,per,i-1);
      const cub=Math.min(mv,Math.max(0,rest)); rest-=cub;
      const pagada=cub>=mv-1, parcial=cub>0&&!pagada, venc=!pagada&&due<today0();
      if(pagada)cuotasPag++;
      if(venc){vencidasN++; vencidasMonto+=(mv-cub);}
      if(!pagada&&!proxima) proxima={i,due,monto:mv,saldoCuota:mv-cub};
      cuotas.push({i,due,monto:mv,cubierto:cub,estado:pagada?'pagada':(venc?'vencida':(parcial?'parcial':'pendiente'))});
    }
  }
  let estado;
  if(saldo<=0) estado='pagado';
  else if(esCuotas) estado = vencidasN>0?'mora':'activo';
  else estado = 'activo';
  return {pagos,pagado,total,saldo,estado,esCuotas,cuotas,proxima,vencidasN,vencidasMonto,cuotasPag,valorCuota,numCuotas};
}
function totals(){
  const prestado=S.loans.reduce((s,l)=>s+num(l.monto),0);
  const recuperado=S.payments.reduce((s,p)=>s+num(p.monto),0);
  let porCobrar=0,enMora=0,activos=0;
  S.loans.forEach(l=>{const c=calc(l);porCobrar+=c.saldo;if(c.estado==='mora')enMora+=c.saldo;if(c.estado!=='pagado')activos++;});
  const base=num(S.config&&S.config.baseInicial);
  return {prestado,recuperado,porCobrar,enMora,base,saldoBase:base-prestado+recuperado,activos};
}
const loanById=id=>S.loans.find(l=>l.id===id)||null;
/* cuotas por cobrar (no pagadas) de todos los préstamos */
function agendaItems(){
  let items=[];
  S.loans.forEach(l=>{const c=calc(l); if(!c.esCuotas)return;
    const nm=(l.cliente&&l.cliente.nombre)||'Cliente';
    c.cuotas.forEach(q=>{ if(q.estado==='pagada')return;
      items.push({loanId:l.id, nombre:nm, cuotaN:q.i, due:q.due, monto:q.monto-(q.cubierto||0), venc:q.estado==='vencida'}); }); });
  items.sort((a,b)=>a.due-b.due);
  return items;
}

function pendientesTxt(c){ return c.cuotas.filter(q=>q.estado!=='pagada').map(q=>'• Cuota '+q.i+' — '+fmtD(q.due)+': '+money(q.monto)+(q.estado==='vencida'?' (vencida)':'')).join('\n'); }

/* ---------- boot / auth ---------- */
function boot(){
  if(String(firebaseConfig.apiKey).indexOf('PEGA')===0){ S.screen='noconfig'; return render(); }
  try{ const fapp=initializeApp(firebaseConfig); auth=getAuth(fapp); db=getFirestore(fapp); }
  catch(e){ S.screen='noconfig'; return render(); }
  onAuthStateChanged(auth, async (user)=>{
    if(user){ me=user; await afterLogin(); }
    else { me=null; teardown(); S.screen='login'; S.error=''; render(); }
  });
}
function teardown(){ [unsubLoans,unsubPays,unsubConfig,unsubBaseLog].forEach(u=>{if(u)u();});
  unsubLoans=unsubPays=unsubConfig=unsubBaseLog=null; S.loans=[];S.payments=[];S.baseLog=[]; }
async function afterLogin(){
  try{
    const uSnap=await getDoc(doc(db,'usuarios',me.uid)); meNombre=uSnap.exists()?(uSnap.data().nombre||''):'';
    const cSnap=await getDoc(doc(db,'config','app')); S.config=cSnap.exists()?cSnap.data():null;
    subscribe();
    S.screen = !meNombre ? 'profile' : (!S.config ? 'setup' : 'home'); S.nav='inicio';
  }catch(e){ S.error='No se pudo cargar: '+(e&&e.message||e); S.screen='login'; }
  render();
}
function subscribe(){
  if(unsubLoans||!db)return;
  unsubLoans=onSnapshot(collection(db,'loans'),s=>{S.loans=s.docs.map(d=>({id:d.id,...d.data()}));if(dataScreen())render();},()=>{});
  unsubPays=onSnapshot(collection(db,'payments'),s=>{S.payments=s.docs.map(d=>({id:d.id,...d.data()}));if(dataScreen())render();},()=>{});
  unsubConfig=onSnapshot(doc(db,'config','app'),snap=>{if(snap.exists()){S.config=snap.data();if(dataScreen()||S.screen==='adjustBase')render();}},()=>{});
  unsubBaseLog=onSnapshot(collection(db,'baseLog'),s=>{S.baseLog=s.docs.map(d=>({id:d.id,...d.data()}));if(S.screen==='adjustBase')render();},()=>{});
}

function render(){
  let h;

    case 'noconfig': h=viewNoConfig(); break;
    case 'login': h=viewLogin(); break;
    case 'profile': h=viewProfile(); break;
    case 'setup': h=viewSetup(); break;
    case 'home': h=viewMain(); break;
    case 'detail': h=viewDetail(); break;
    case 'newLoan': h=viewLoanForm(); break;
    case 'pay': h=viewPay(); break;
    case 'adjustBase': h=viewAdjustBase(); break;
    default: h='<div class="splash"><div><div class="spin"></div><div style="margin-top:12px">Cargando…</div></div></div>';

  app.innerHTML=h; bind();
}

function dashboardCard(){

  const alDia=Math.max(0,t.porCobrar-t.enMora), disp=Math.max(0,t.saldoBase), mora=Math.max(0,t.enMora);

  const tot=disp+alDia+mora; const r=54,C=2*Math.PI*r,gap=3; let off=0,arcs='';
  if(tot>0){ segs.forEach(s=>{ if(s.v<=0)return; const len=s.v/tot*C,dash=Math.max(0.1,len-gap);
    arcs+='<circle cx="80" cy="80" r="'+r+'" fill="none" stroke="'+s.c+'" stroke-width="22" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-off)+'"><title>'+esc(s.k)+': '+money(s.v)+'</title></circle>'; off+=len; }); }

function uploadPhoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(u); const max=1200; let w=img.width,h=img.height;
      if(w>max||h>max){ if(w>=h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      let q=0.72, data=c.toDataURL('image/jpeg',q); while(data.length>900000 && q>0.35){ q-=0.1; data=c.toDataURL('image/jpeg',q); } resolve(data); };
    img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('No se pudo leer la imagen'));}; img.src=u; });
}
async function doLoan(){
  S.error='';
  const nombre=(qs('#f_nombre').value||'').trim(); const monto=num(qs('#f_monto').value); const intr=num(qs('#f_int').value);

  if(!nombre){S.error='Escribe el nombre del cliente.';return render();}
  if(monto<=0){S.error='El monto prestado debe ser mayor a 0.';return render();}
  if(isC && vcuo<=0){S.error='Escribe el valor de cada cuota.';return render();}
  if(!S.draftFile){S.error='Debes cargar la foto de evidencia.';return render();}
  savingOn('Subiendo evidencia…');
  try{
    const url=await uploadPhoto(S.draftFile);
    const docu={cliente:{nombre,tel:qs('#f_tel').value.trim()},
      monto,interesPct:intr,tipo:S.loanType,
      periodicidad:isC?qs('#f_per').value:'',
      valorCuota:isC?vcuo:0,
      fechaPrimeraCuota:isC?((qs('#f_fprim')||{}).value||''):'',
      fechaDesembolso:qs('#f_fdes').value||'',
      evidenciaUrl:url,notas:qs('#f_notas').value.trim(),registradoPor:meNombre,createdAt:Date.now()};
    const ref=await addDoc(collection(db,'loans'),docu);
    clearDraft(); S.loanDraft={}; S.selId=ref.id; S.justSaved=true; S.justPayId=null; S.justPayCuota=null; S.screen='detail';

  savingOff(); render();
}

    const lab=x.tipo==='retirar'?'Retiro':(x.tipo==='agregar'?'Aporte':'Ajuste a '+money(x.nuevoValor));
    const cls=x.tipo==='retirar'?'val':'val in';
    const avbg=x.tipo==='retirar'?'background:var(--bad-soft);color:var(--bad)':(x.tipo==='agregar'?'background:var(--good-soft);color:var(--good)':'background:var(--inset);color:var(--muted)');
    return '<div class="row"><span class="av" style="'+avbg+'">'+ic+'</span><span class="mid"><span class="nm">'+lab+'</span>'+
      '<span class="meta">'+fmtDateTime(x.createdAt)+' · '+esc(x.registradoPor||'')+(x.nota?(' · '+esc(x.nota)):'')+'</span></span>'+
      '<span class="right"><span class="'+cls+' tnum">'+sign+money(x.monto)+'</span></span></div>';}).join('')+'</div>'; }
  return head+'<div class="formwrap">'+(S.error?'<div class="err">'+esc(S.error)+'</div>':'')+info+form+hist+'</div>';
}
async function doAdjustBase(){
  S.error=''; const op=S.baseOp; const monto=num(qs('#b_monto').value); const nota=qs('#b_nota').value.trim();
  if(monto<=0){S.error='Escribe un monto mayor a 0.';return render();}
  const base=num(S.config&&S.config.baseInicial);
  const nuevo=op==='agregar'?base+monto:(op==='retirar'?base-monto:monto);
  if(nuevo<0){S.error='La base no puede quedar negativa.';return render();}
  savingOn('Guardando…');
  try{ const cfg=Object.assign({},S.config||{moneda:'COP'},{baseInicial:nuevo}); await setDoc(doc(db,'config','app'),cfg); S.config=cfg;
    await addDoc(collection(db,'baseLog'),{tipo:op,monto:monto,nuevoValor:nuevo,nota,registradoPor:meNombre,createdAt:Date.now()});
    S.baseDraft=''; S.screen='home'; S.nav='inicio'; }
  catch(e){ S.error='No se pudo guardar: '+(e&&e.message||e); }
  savingOff(); render();
}

/* ---------- draft foto / overlays ---------- */
function setDraft(file){ clearDraft(); if(file){S.draftFile=file; try{S.draftURL=URL.createObjectURL(file);}catch(e){S.draftURL=null;}} render(); }
function clearDraft(){ if(S.draftURL){try{URL.revokeObjectURL(S.draftURL);}catch(e){}} S.draftFile=null; S.draftURL=null; }
function lightbox(url){ const ov=document.createElement('div');ov.className='overlay lightbox'; ov.innerHTML='<img alt="Evidencia">'; ov.querySelector('img').src=url;
  ov.addEventListener('click',()=>document.body.removeChild(ov)); document.body.appendChild(ov); }
function confirmBox(title,msg){ return new Promise(res=>{ const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="confirm"><h3>'+esc(title)+'</h3><p>'+esc(msg)+'</p><div class="btnrow"><button class="btn sec" data-c="no">Cancelar</button><button class="btn danger" data-c="yes">Eliminar</button></div></div>';
  ov.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b&&e.target!==ov)return;const yes=b&&b.getAttribute('data-c')==='yes';document.body.removeChild(ov);res(!!yes);});
  document.body.appendChild(ov); }); }
let savingEl=null;
function savingOn(t){ savingOff(); savingEl=document.createElement('div');savingEl.className='saving';
  savingEl.innerHTML='<div class="box"><div class="spin"></div><div style="margin-top:12px;font-weight:600">'+esc(t||'Guardando…')+'</div></div>'; document.body.appendChild(savingEl); }
function savingOff(){ if(savingEl&&savingEl.parentNode)savingEl.parentNode.removeChild(savingEl); savingEl=null; }

/* ---------- bind / eventos ---------- */
function bind(){
  let f;
  if(f=qs('#loginForm'))f.addEventListener('submit',e=>{e.preventDefault();doLogin();});
  if(f=qs('#profileForm'))f.addEventListener('submit',e=>{e.preventDefault();doProfile();});
  if(f=qs('#setupForm'))f.addEventListener('submit',e=>{e.preventDefault();doSetup();});
  if(f=qs('#loanForm'))f.addEventListener('submit',e=>{e.preventDefault();doLoan();});
  if(f=qs('#payForm'))f.addEventListener('submit',e=>{e.preventDefault();doPay();});
  if(f=qs('#baseForm'))f.addEventListener('submit',e=>{e.preventDefault();doAdjustBase();});
  let fi; if(fi=qs('#f_foto'))fi.addEventListener('change',e=>{if(e.target.files[0]){captureLoanForm();setDraft(e.target.files[0]);}});
}
app.addEventListener('click',e=>{
  let el;
  if(el=e.target.closest('[data-nav]')){S.nav=el.getAttribute('data-nav');render();return;}
  if(el=e.target.closest('[data-ltype]')){captureLoanForm();S.loanType=el.getAttribute('data-ltype');render();return;}
  if(el=e.target.closest('[data-baseop]')){const mi=qs('#b_monto');if(mi)S.baseDraft=mi.value;S.baseOp=el.getAttribute('data-baseop');render();return;}
  if(el=e.target.closest('[data-wapay]')){const p=S.payments.find(x=>x.id===el.getAttribute('data-wapay'));
    if(p){const l=loanById(p.loanId); if(l) openWA((l.cliente&&l.cliente.tel)||'', msgPagoCuota(l,calc(l),p.cuotaN||'?',p.monto));} return;}
  if(el=e.target.closest('[data-wapaidc]')){const l=loanById(S.selId); if(l){const c=calc(l);
    const pays=c.pagos; const last=pays[0]; openWA((l.cliente&&l.cliente.tel)||'', msgPagoCuota(l,c,(last&&last.cuotaN)||S.justPayCuota||'?',(last&&last.monto)||0));}
    S.justPayId=null; return;}
  if(el=e.target.closest('[data-waremind]')){const pr=el.getAttribute('data-waremind').split('|');const l=loanById(pr[0]);
    if(l) openWA((l.cliente&&l.cliente.tel)||'', msgRecordatorio(l,calc(l),pr[1])); return;}
  if(el=e.target.closest('[data-paycuota]')){const pr=el.getAttribute('data-paycuota').split('|');
    S.payCtx={loanId:pr[0],cuotaN:num(pr[1]),monto:num(pr[2])}; S.selId=pr[0]; S.error='';clearDraft();S.justSaved=false;S.justPayId=null;S.screen='pay';render();return;}
  if(el=e.target.closest('[data-open]')){S.selId=el.getAttribute('data-open');S.justSaved=false;S.justPayId=null;S.screen='detail';render();return;}
  if(el=e.target.closest('[data-viewimg]')){lightbox(el.getAttribute('data-viewimg'));return;}
  const act=e.target.closest('[data-act]'); if(!act)return;
  switch(act.getAttribute('data-act')){
    case 'logout': S.justSaved=false;S.justPayId=null; signOut(auth); break;
    case 'newLoan': clearDraft();S.loanDraft={};S.loanType='unico';S.periodic='semanal';S.error='';S.justSaved=false;S.justPayId=null;S.screen='newLoan';render();break;
    case 'newPayment': { const l=loanById(S.selId); const c=l?calc(l):null;
      if(c&&c.esCuotas&&c.proxima) S.payCtx={loanId:S.selId,cuotaN:c.proxima.i,monto:c.proxima.saldoCuota};
      else S.payCtx={loanId:S.selId,cuotaN:null,monto:c?c.saldo:0};
      clearDraft();S.error='';S.justSaved=false;S.justPayId=null;S.screen='pay';render();break; }
    case 'back': clearDraft();S.payCtx=null;S.error='';S.justSaved=false;S.justPayId=null;S.screen='home';render();break;
    case 'backDetail': clearDraft();S.payCtx=null;S.error='';S.screen='detail';render();break;
    case 'delLoan': delLoan(); break;
    case 'adjustBase': S.error='';S.baseOp='agregar';S.baseDraft='';S.screen='adjustBase';render();break;
    case 'waLoan': { const l=loanById(S.selId); if(l) openWA((l.cliente&&l.cliente.tel)||'', msgLoan(l,calc(l))); S.justSaved=false; break; }
    case 'waPlan': { const l=loanById(S.selId); if(l) openWA((l.cliente&&l.cliente.tel)||'', msgPlan(l,calc(l))); break; }
    case 'waDismiss': S.justSaved=false;S.justPayId=null; render(); break;
  }
});
boot();
</script>
